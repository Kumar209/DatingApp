<div class="flex h-[calc(100vh-80px)] overflow-hidden">
  <aside
    class="border-r border-base-300 bg-base-100/95 backdrop-blur-xl transition-all duration-300"
    [class.w-72]="sidebarOpen()"
    [class.w-24]="!sidebarOpen()"
  >
    <!-- HEADER -->

    <div class="flex h-20 items-center justify-between border-b border-base-300 px-5">
      @if (sidebarOpen()) {
        <div>
          <h1 class="text-xl font-black tracking-tight">Admin</h1>

          <p class="text-xs uppercase tracking-widest text-base-content/50">Management Panel</p>
        </div>
      }

      <button class="btn btn-ghost btn-circle" (click)="toggleSidebar()">☰</button>
    </div>

    <!-- NAVIGATION -->

    <div class="p-4">
      <!-- <div
        class="mb-4 px-3 text-[10px] font-bold uppercase tracking-[0.25em] text-base-content/40"
        [class.hidden]="!sidebarOpen()"
      >
        Administration
      </div> -->

      <ul class="menu gap-3">
        <!-- USER MANAGEMENT -->

        <li>
          <a
            routerLink="/admin/users"
            routerLinkActive="bg-primary text-primary-content shadow-lg"
            class="group flex h-14 items-center rounded-2xl transition-all duration-300"
          >
            <div
              class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary/10 transition-all group-hover:bg-primary/20"
            >
              <img src="/user-manage.png" alt="Users" class="h-6 w-6 object-contain" />
            </div>

            @if (sidebarOpen()) {
              <div class="ml-4">
                <div class="font-semibold">User Management</div>

                <!-- <div class="text-xs opacity-70">
                Manage platform users
              </div> -->
              </div>
            }
          </a>
        </li>

        <!-- PHOTO MODERATION -->

        <li>
          <a
            routerLink="/admin/photos"
            routerLinkActive="bg-primary text-primary-content shadow-lg"
            class="group flex h-14 items-center rounded-2xl transition-all duration-300"
          >
            <div
              class="flex h-10 w-10 items-center justify-center rounded-xl bg-warning/10 transition-all group-hover:bg-warning/20"
            >
              <img src="/photo-manage.png" alt="Photos" class="h-6 w-6 object-contain" />
            </div>

            @if (sidebarOpen()) {
              <div class="ml-4">
                <div class="font-semibold">Photo Moderation</div>

                <!-- <div class="text-xs opacity-70">
                Review uploaded photos
              </div> -->
              </div>
            }
          </a>
        </li>
      </ul>
    </div>

    <!-- FOOTER -->

    @if (sidebarOpen()) {
      <div class="absolute bottom-4 left-4 right-4">
        <div class="rounded-2xl border border-base-300 bg-base-200/50 p-4">
          <div class="text-xs uppercase tracking-widest text-base-content/50">System Status</div>

          <div class="mt-2 flex items-center gap-2">
            <div class="h-2.5 w-2.5 rounded-full bg-success animate-pulse"></div>

            <span class="text-sm font-medium"> All Services Online </span>
          </div>
        </div>
      </div>
    }
  </aside>

  <main class="flex-1 overflow-auto p-4 md:p-6">
    <router-outlet />
  </main>
</div>
